[package]
name = "dev-dashboard"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.24"
crossterm = "0.27"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
sysinfo = "0.30"
chrono = { version = "0.4", features = ["serde"] }
signal-hook = "0.3"
